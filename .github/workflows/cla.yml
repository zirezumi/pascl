name: CLA

# Every outside contributor signs the Individual Contributor License Agreement (CLA.md) once,
# by commenting the sentence below on their first pull request. Signatures are recorded on the
# `cla-signatures` branch of this repository, never in main.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: "signatures/version1/cla.json"
          path-to-document: "https://github.com/zirezumi/pascl/blob/main/CLA.md"
          branch: "cla-signatures"
          allowlist: zirezumi,dependabot[bot]
          custom-notsigned-prcomment: "Thank you for the pull request. Before it can be reviewed, please read [CLA.md](https://github.com/zirezumi/pascl/blob/main/CLA.md) and, if you agree, sign it by posting the sentence below as a comment. You only do this once."
          custom-pr-sign-comment: "I have read the CLA Document and I hereby sign the CLA"
          custom-allsigned-prcomment: "All contributors have signed the CLA."
